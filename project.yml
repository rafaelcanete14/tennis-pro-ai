name: TennisProAI
options:
  bundleIdPrefix: com.tennisproai
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  TennisProAI:
    type: application
    platform: iOS
    sources:
      - path: TennisProAI
        excludes:
          - Resources/Info.plist
    info:
      path: TennisProAI/Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tennisproai.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  TennisProAITests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - TennisProAITests
    dependencies:
      - target: TennisProAI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tennisproai.app.tests
        GENERATE_INFOPLIST_FILE: YES
  TennisProAIUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - TennisProAIUITests
    dependencies:
      - target: TennisProAI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tennisproai.app.uitests
        GENERATE_INFOPLIST_FILE: YES

