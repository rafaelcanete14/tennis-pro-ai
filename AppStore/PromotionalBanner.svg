<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1418"/>
      <stop offset="55%" stop-color="#0E2620"/>
      <stop offset="100%" stop-color="#09161C"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1FB06B"/>
      <stop offset="100%" stop-color="#B0E833"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Perspective Court Lines -->
  <g stroke="#1FB06B" stroke-opacity="0.22" stroke-width="3" fill="none">
    <polygon points="720,130 1120,130 1180,530 660,530"/>
    <line x1="920" y1="130" x2="920" y2="530"/>
    <line x1="690" y1="315" x2="1150" y2="315"/>
  </g>
  <!-- Stylized Tennis Sphere & Viewfinder -->
  <g transform="translate(920, 315)">
    <circle r="105" fill="url(#accent)"/>
    <path d="M -74,-74 Q -10,0 -74,74" stroke="#0B1418" stroke-width="10" fill="none"/>
    <path d="M 74,-74 Q 10,0 74,74" stroke="#0B1418" stroke-width="10" fill="none"/>
    <path d="M -140,-95 L -140,-140 L -95,-140" stroke="#B0E833" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M 140,-95 L 140,-140 L 95,-140" stroke="#B0E833" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M -140,95 L -140,140 L -95,140" stroke="#1FB06B" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M 140,95 L 140,140 L 95,140" stroke="#1FB06B" stroke-width="8" fill="none" stroke-linecap="round"/>
  </g>
  <!-- Title Copy -->
  <text x="80" y="235" fill="#B0E833" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="800" letter-spacing="3">BUILT FOR iPHONE 16 PRO MAX • iOS 18</text>
  <text x="80" y="320" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="68" font-weight="900">Tennis Pro AI</text>
  <text x="80" y="385" fill="#B8CDD2" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="28" font-weight="500">Record Matches • Cut Highlights • Live Scorecard • Vision Pose Lab</text>
  <rect x="80" y="435" width="340" height="58" rx="16" fill="url(#accent)"/>
  <text x="250" y="472" text-anchor="middle" fill="#0B1418" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="800">100% On-Device &amp; Private</text>
</svg>

